<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Vehicle Tracking - Fleetly GPS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg: #f4f5f8;
            --surface: #ffffff;
            --border: rgba(0, 0, 0, 0.06);
            --primary: #ff3b70;
            --text: #2b354e;
            --muted: #64748b;
            --danger: #ff3d00;
            --warning: #ffab00;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #map {
            flex: 1;
            height: 100%;
            width: 100%;
        }

        /* Dark Theme Leaflet Customization (Disabled for Light Theme)
        .leaflet-layer,
        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out,
        .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        */

        .header-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 8px;
            display: grid;
            place-items: center;
        }

        .logo-text h1 {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .logo-text span {
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: var(--muted);
            text-transform: uppercase;
            display: block;
        }

        .status-badge {
            background: rgba(255, 59, 112, 0.08);
            color: var(--primary);
            border: 1px solid rgba(255, 59, 112, 0.15);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }

        /* Error Overlay styling */
        .error-overlay {
            position: fixed;
            inset: 0;
            background: rgba(244, 245, 248, 0.95);
            backdrop-filter: blur(10px);
            z-index: 10000;
            display: none;
            place-items: center;
            padding: 20px;
        }

        .error-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 10px 45px rgba(0, 0, 0, 0.05);
        }

        .error-icon {
            font-size: 3.5rem;
            color: var(--danger);
            margin-bottom: 1.5rem;
        }

        .error-card h2 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.8rem;
        }

        .error-card p {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Custom vehicle marker style */
        .custom-vehicle-marker {
            display: grid;
            place-items: center;
        }
        .vehicle-beacon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            transition: all 0.3s;
        }
        .heading-arrow {
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .beacon-pulse {
            animation: pulse-ring 2s infinite;
        }
        
        .info-panel {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 1000;
            width: 320px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            display: none;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
            font-size: 0.85rem;
        }
        .info-row span:first-child {
            color: var(--muted);
        }
        .info-row span:last-child {
            font-weight: 600;
        }
    </style>
</head>
<body>
    
    <div class="header-bar">
        <div class="logo-wrap">
            <div class="logo-icon">
                <i class="fa-solid fa-truck-fast" style="color: #ffffff; font-size: 1.1rem;"></i>
            </div>
            <div class="logo-text">
                <h1 id="vehicleName">Vehicle</h1>
                <span>Live Location Share</span>
            </div>
        </div>
        
        <div class="status-badge">
            <span class="status-dot"></span> Live Tracking
        </div>
    </div>

    <!-- Map container -->
    <div id="map"></div>
    
    <!-- Info Panel overlay -->
    <div class="info-panel" id="infoPanel">
        <h3 id="panelTitle" style="font-size: 1rem; font-weight: 800; margin-bottom: 10px; color: var(--primary);">VEHICLE</h3>
        <div class="info-row"><span>Status</span> <span id="valStatus" style="color: var(--primary);">Running</span></div>
        <div class="info-row"><span>Speed</span> <span id="valSpeed">0 km/h</span></div>
        <div class="info-row"><span>Odometer</span> <span id="valOdometer">--</span></div>
        <div class="info-row"><span>Last Seen</span> <span id="valTime">Just now</span></div>
    </div>

    <!-- Expiration Error overlay -->
    <div class="error-overlay" id="errorOverlay">
        <div class="error-card">
            <div class="error-icon">
                <i class="fa-solid fa-circle-exclamation"></i>
            </div>
            <h2>Link Expired</h2>
            <p>This tracking link is no longer valid or has expired. Please request a new tracking link from the owner.</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/share.js"></script>
</body>
</html>
