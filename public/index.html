<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleetly GPS - Premium Tracker</title>
    <link rel="stylesheet" href="css/main.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-bg-shapes"></div>
        
        <div class="auth-container">
            <div class="auth-card glass-panel">
                <div class="auth-icon">
                    <i class="fa-solid fa-satellite-dish"></i>
                </div>
                <h1>Fleetly GPS</h1>
                <p>Welcome back! Secure access to your fleet.</p>
                
                <div class="form-group">
                    <input type="text" id="username" class="form-control" placeholder=" " required>
                    <label for="username" style="position: absolute; top: 12px; left: 20px; pointer-events: none; opacity: 0; transition: all 0.2s;">Username</label>
                </div>
                
                <div class="form-group">
                    <input type="password" id="password" class="form-control" placeholder=" " required>
                    <label for="password" style="position: absolute; top: 12px; left: 20px; pointer-events: none; opacity: 0; transition: all 0.2s;">Password</label>
                </div>
                
                <button id="loginBtn" class="btn btn-primary" style="margin-top: 1.5rem; width: 100%;">
                    <span>Access Dashboard</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
                
                <div id="errorMsg" style="color: var(--danger); margin-top: 1rem; font-size: 0.875rem; min-height: 20px; font-weight: 500;"></div>
            </div>
        </div>
    </div>

    <!-- Script to handle floating labels (micro-animation) -->
    <script>
        document.querySelectorAll('.form-control').forEach(input => {
            const label = input.nextElementSibling;
            
            // Initial placeholder setting to show label text when empty
            input.placeholder = label.innerText;
            
            input.addEventListener('focus', () => {
                input.placeholder = '';
                label.style.opacity = '1';
                label.style.top = '-20px';
                label.style.left = '0';
                label.style.fontSize = '0.8rem';
            });
            
            input.addEventListener('blur', () => {
                if(input.value === '') {
                    input.placeholder = label.innerText;
                    label.style.opacity = '0';
                    label.style.top = '12px';
                    label.style.left = '20px';
                }
            });
        });
    </script>
    <script src="js/login.js"></script>
</body>
</html>
