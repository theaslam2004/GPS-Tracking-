<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleetly GPS - Premium Tracker</title>
    <link rel="stylesheet" href="css/main.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff3b70;
            --accent: #E91E63;
            --bg-main: #f4f5f8;
            --bg-surface: #ffffff;
            --border: rgba(0, 0, 0, 0.06);
            --border-light: rgba(0, 0, 0, 0.08);
            --text-primary: #2b354e;
            --text-secondary: #64748b;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-full: 9999px;
            --font-main: 'Outfit', 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main) !important;
            color: var(--text-primary) !important;
            font-family: var(--font-main) !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .auth-wrapper {
            background-color: #f4f5f8 !important;
            background-image: radial-gradient(rgba(255, 59, 112, 0.05) 1px, transparent 1px), radial-gradient(rgba(255, 59, 112, 0.05) 1px, #f4f5f8 1px) !important;
            background-size: 24px 24px !important;
            background-position: 0 0, 12px 12px !important;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Subtle background shapes in pink/blue gradients */
        .auth-bg-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
        }
        .auth-bg-shapes::before {
            content: '';
            position: absolute;
            top: -150px;
            right: -150px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 59, 112, 0.08) 0%, transparent 70%);
        }
        .auth-bg-shapes::after {
            content: '';
            position: absolute;
            bottom: -150px;
            left: -150px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.06) 0%, transparent 70%);
        }

        .auth-container {
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-surface) !important;
            border: 1px solid var(--border) !important;
            border-radius: var(--radius-lg) !important;
            box-shadow: 0 10px 35px rgba(255, 59, 112, 0.04) !important;
            padding: 2.5rem 2rem !important;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .auth-icon {
            width: 64px !important;
            height: 64px !important;
            border-radius: 50% !important;
            background: rgba(255, 59, 112, 0.08) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 1.6rem !important;
            margin-bottom: 1.5rem !important;
            box-shadow: 0 4px 12px rgba(255, 59, 112, 0.1) !important;
        }
        .auth-icon i {
            background: linear-gradient(135deg, var(--primary), var(--accent)) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            display: inline-block !important;
        }

        .auth-card h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary) !important;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.5px;
            font-family: 'Outfit', sans-serif;
        }

        .auth-card p {
            font-size: 0.9rem;
            color: var(--text-secondary) !important;
            margin: 0 0 2rem 0;
        }

        .form-group {
            width: 100%;
            margin-bottom: 1.5rem;
            position: relative;
            text-align: left;
        }

        .form-control {
            width: 100% !important;
            padding: 0.75rem 1rem !important;
            border-radius: var(--radius-md) !important;
            border: 1px solid var(--border-light) !important;
            background: var(--bg-main) !important;
            color: var(--text-primary) !important;
            font-size: 0.9rem !important;
            font-weight: 500 !important;
            transition: all 0.2s !important;
            outline: none !important;
            height: auto !important;
        }

        .form-control:focus {
            border-color: var(--primary) !important;
            background: var(--bg-surface) !important;
            box-shadow: 0 0 0 3px rgba(255, 59, 112, 0.12) !important;
        }

        .form-group label {
            font-family: var(--font-main);
            font-weight: 600;
            color: var(--text-secondary);
        }

        .btn-primary {
            background: var(--primary) !important;
            color: #ffffff !important;
            border: none !important;
            border-radius: var(--radius-md) !important;
            padding: 0.8rem 1.5rem !important;
            font-weight: 700 !important;
            font-size: 0.95rem !important;
            cursor: pointer !important;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(255, 59, 112, 0.15) !important;
            transition: all 0.2s !important;
        }

        .btn-primary:hover {
            background: var(--accent) !important;
            box-shadow: 0 6px 16px rgba(255, 59, 112, 0.25) !important;
        }

        #errorMsg {
            color: var(--danger) !important;
            font-size: 0.85rem !important;
            margin-top: 1rem !important;
            font-weight: 600 !important;
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-bg-shapes"></div>
        
        <div class="auth-container">
            <div class="auth-card glass-panel">
                <div class="auth-icon">
                    <i class="fa-solid fa-satellite-dish"></i>
                </div>
                <h1>Fleetly GPS</h1>
                <p>Welcome back! Secure access to your fleet.</p>
                
                <div class="form-group">
                    <input type="text" id="username" class="form-control" placeholder=" " required>
                    <label for="username" style="position: absolute; top: 12px; left: 20px; pointer-events: none; opacity: 0; transition: all 0.2s;">Username</label>
                </div>
                
                <div class="form-group">
                    <input type="password" id="password" class="form-control" placeholder=" " required>
                    <label for="password" style="position: absolute; top: 12px; left: 20px; pointer-events: none; opacity: 0; transition: all 0.2s;">Password</label>
                </div>
                
                <button id="loginBtn" class="btn btn-primary" style="margin-top: 1.5rem; width: 100%;">
                    <span>Access Dashboard</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
                
                <div id="errorMsg" style="color: var(--danger); margin-top: 1rem; font-size: 0.875rem; min-height: 20px; font-weight: 500;"></div>
            </div>
        </div>
    </div>

    <!-- Script to handle floating labels (micro-animation) -->
    <script>
        document.querySelectorAll('.form-control').forEach(input => {
            const label = input.nextElementSibling;
            
            // Initial placeholder setting to show label text when empty
            input.placeholder = label.innerText;
            
            input.addEventListener('focus', () => {
                input.placeholder = '';
                label.style.opacity = '1';
                label.style.top = '-20px';
                label.style.left = '0';
                label.style.fontSize = '0.8rem';
            });
            
            input.addEventListener('blur', () => {
                if(input.value === '') {
                    input.placeholder = label.innerText;
                    label.style.opacity = '0';
                    label.style.top = '12px';
                    label.style.left = '20px';
                }
            });
        });
    </script>
    <script src="js/login.js"></script>
</body>
</html>
