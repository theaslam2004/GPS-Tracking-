<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fleetly GPS Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f1a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #6c63ff, #3ecfcf);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 16px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        p { color: #888; font-size: 14px; }
        .loader {
            margin-top: 32px;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(108,99,255,0.2);
            border-top-color: #6c63ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="logo">📡</div>
    <h1>Fleetly GPS</h1>
    <p>Loading your fleet...</p>
    <div class="loader"></div>
    <script>
        // Redirect to the customer app on the server
        // The server URL is configured in capacitor.config.json
        // When served via Capacitor, it automatically uses the server.url
        setTimeout(() => {
            window.location.href = '/customer.html';
        }, 100);
    </script>
</body>
</html>
